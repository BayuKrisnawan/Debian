name: Build Custom Debian ISO

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y live-build xorriso squashfs-tools curl sudo

      - name: Run Live-Build
        run: |
          lb clean --all

          # 1. Jalankan lb config standar untuk membuat struktur dasar folder
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware"

          # 2. INJECT HOOK UNTUK SETUP REPOSITORI DOCKER DI DALAM CHROOT
          mkdir -p config/hooks/live
          
          cat << 'EOF' > config/hooks/live/0000-setup-docker-repo.chroot
          #!/bin/sh
          set -e

          # Install dependensi dasar yang dibutuhkan apt transport di dalam chroot
          apt-get update
          apt-get install -y ca-certificates curl gnupg

          # Unduh dan pasang kunci GPG resmi Docker di lokasi modern keyring
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg

          # Tambahkan repositori resmi Docker CE ke sources.list.d target
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list

          # Update indeks paket agar docker-ce langsung dikenali di fasa berikutnya
          apt-get update
          EOF

          # 3. WAJIB: Berikan hak akses eksekusi (+x) pada file hook agar mau berjalan
          chmod +x config/hooks/live/0000-setup-docker-repo.chroot

          # 4. Mulai proses pembangunan ISO
          lb build --verbose

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-debian-docker-iso
          path: "*.iso"