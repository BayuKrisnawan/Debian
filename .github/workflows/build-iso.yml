name: Build Custom Debian ISO

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # JALANKAN LANGSUNG DI DALAM CONTAINER DEBIAN STERIL
    container:
      image: debian:bookworm
      options: --privileged # Wajib untuk loop-mounting di dalam container
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y live-build xorriso squashfs-tools curl sudo

      - name: Run Live-Build
        run: |
          lb clean --all
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware"
          lb build --verbose

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-debian-docker-iso
          path: "*.iso"