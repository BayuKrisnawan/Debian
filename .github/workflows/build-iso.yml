name: Build Custom Debian ISO

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # JALANKAN LANGSUNG DI DALAM CONTAINER DEBIAN STERIL
    container:
      image: debian:bookworm
      options: --privileged # Wajib untuk loop-mounting di dalam container
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y live-build xorriso squashfs-tools curl sudo

      - name: Run Live-Build
        run: |
          lb clean --all

          # INJECT REPOSITORI DOCKER CE SECARA PAKSA LEWAT PIPELINE
          mkdir -p config/repositories
          
          # 1. Download kunci resmi GPG Docker langsung ke direktori live-build
          curl -fsSL https://download.docker.com/linux/debian/gpg -o config/repositories/docker.key.chroot
          
          # 2. Buat file list repositori Docker khusus untuk chroot target
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.key.chroot] https://download.docker.com/linux/debian bookworm stable" > config/repositories/docker.list.chroot

          # Jalankan konfigurasi live-build standar
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware"
            
          lb build --verbose

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-debian-docker-iso
          path: "*.iso"